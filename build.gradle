plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}
version = mod_version
group = 'dev.stillworld'
base { archivesName = 'stillworld-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://maven.theillusivec4.top/' }
}
dependencies {
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}
sourceSets {
    regression { java.srcDirs = ['src/regression/java', 'src/main/java/dev/stillworld/core'] }
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    visualTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    multiplayerTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        visualClient {
            client()
            systemProperty 'stillworld.automatedClient', 'true'
            if (providers.gradleProperty('hiddenVisualTest').isPresent()) systemProperty 'stillworld.hiddenTestWindow', 'true'
            sourceSet = sourceSets.visualTest
            gameDirectory = project.file('run')
            programArgument '--quickPlaySingleplayer'
            programArgument 'StillworldSmoke'
            systemProperty 'stillworld.visualTest.auto', 'true'
            if (providers.gradleProperty('workshopTest').isPresent()) systemProperty 'stillworld.workshopTest', 'true'
            if (providers.gradleProperty('entryProfile').isPresent()) {
                systemProperty 'stillworld.entryProfile', 'true'
                jvmArgument '-XX:FlightRecorderOptions=repository=' + project.file('run/jfr').absolutePath
            }
            systemProperty 'stillworld.visualTest.output', project.file(providers.gradleProperty('visualEvidence').orElse("docs/verification/visual-client-${project.mod_version}").get()).absolutePath
        }
        multiplayerHost {
            client()
            systemProperty 'stillworld.automatedClient', 'true'
            if (providers.gradleProperty('hiddenVisualTest').isPresent()) systemProperty 'stillworld.hiddenTestWindow', 'true'
            sourceSet = sourceSets.multiplayerTest
            gameDirectory = project.file('run/multiplayer-host')
            programArguments.addAll('--username', 'PhaseHost', '--quickPlaySingleplayer', 'StillworldMultiplayerSmoke')
            systemProperty 'stillworld.multi.role', 'host'
            systemProperty 'stillworld.multi.evidence', project.file('run/multiplayer-evidence').absolutePath
        }
        multiplayerObserver {
            client()
            systemProperty 'stillworld.automatedClient', 'true'
            if (providers.gradleProperty('hiddenVisualTest').isPresent()) systemProperty 'stillworld.hiddenTestWindow', 'true'
            sourceSet = sourceSets.multiplayerTest
            gameDirectory = project.file('run/multiplayer-observer')
            programArguments.addAll('--username', 'Observer', '--quickPlayMultiplayer', 'localhost:25588')
            systemProperty 'stillworld.multi.role', 'observer'
            systemProperty 'stillworld.multi.evidence', project.file('run/multiplayer-evidence').absolutePath
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'stillworld'
        }
    }
    mods {
        stillworld {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
            if (providers.gradleProperty('visualTest').isPresent()) sourceSet(sourceSets.visualTest)
            if (providers.gradleProperty('multiplayerTest').isPresent()) sourceSet(sourceSets.multiplayerTest)
        }
    }
}
tasks.register('regressionTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.stillworld.CoreTests'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('test') { dependsOn 'regressionTest' }
tasks.named('check') { dependsOn 'regressionTest' }

tasks.named('runVisualClient') {
    doFirst {
        if (providers.gradleProperty('entryProfile').isPresent()) project.file('run/jfr').mkdirs()
    }
}

// Runs only an invisible OpenGL context. No Minecraft window, input capture or test world.
tasks.register('spatialShaderTest', JavaExec) {
    group = 'verification'
    dependsOn 'visualTestClasses'
    classpath = sourceSets.visualTest.runtimeClasspath
    mainClass = 'dev.stillworld.client.SpatialShaderProbe'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'stillworld.automatedClient', 'true'
    args project.file('src/main/resources/assets/stillworld/shaders/program').absolutePath,
         project.file("docs/verification/spatial-reflection-${project.version}").absolutePath,
         providers.gradleProperty('probeWidth').orElse('640').get(),
         providers.gradleProperty('probeHeight').orElse('360').get()
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('bladeShaderTest', JavaExec) {
    group = 'verification'
    dependsOn 'visualTestClasses'
    classpath = sourceSets.visualTest.runtimeClasspath
    mainClass = 'dev.stillworld.client.BladeShaderProbe'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'stillworld.automatedClient', 'true'
    args project.file('src/main/resources/assets/stillworld/shaders/core').absolutePath
}
tasks.named('jar') { manifest.attributes('Implementation-Version': project.version) }

// Invisible GLSL test for the spherical live-world compositor.
tasks.register('orbShaderTest', JavaExec) {
    group = 'verification'
    dependsOn 'visualTestClasses'
    classpath = sourceSets.visualTest.runtimeClasspath
    mainClass = 'dev.stillworld.client.OrbShaderProbe'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'stillworld.automatedClient', 'true'
    args project.file('src/main/resources/assets/stillworld/shaders/program').absolutePath,
         project.file("docs/verification/orb-shader-${project.version}").absolutePath,
         providers.gradleProperty('probeWidth').orElse('640').get(),
         providers.gradleProperty('probeHeight').orElse('360').get()
}
